{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="register-wrapper">
    <div class="register-container">
        <div class="register-card">
            <div class="card-header">
                <div class="header-icon">👤</div>
                <h1 class="register-title">Create Account</h1>
                <p class="register-subtitle">Join us to find your dream job or top talent</p>
            </div>
            
            <form method='POST' action='{% url 'register' %}' class="register-form">
                {% csrf_token %}
                {{ form|crispy }}
                
                <button type="submit" class="submit-button">
                    <span class="btn-text">Get Started</span>
                    
                </button>
            </form>
            
            <div class="card-footer">
                <p>Already have an account? <a href="{% url 'login_view' %}" class="login-link">Sign in</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* ========================================
   FULLSCREEN RESPONSIVE WRAPPER
======================================= */
.register-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 5vw, 3rem);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 20%, #f093fb 50%, #f5576c 80%, #4facfe 100%);
    position: relative;
    overflow: hidden;
}

.register-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
    pointer-events: none;
    z-index: 0;
}

.register-container {
    width: 100%;
    max-width: clamp(400px, 90vw, 520px);
    position: relative;
    z-index: 2;
}

/* ========================================
   REGISTER CARD - LUXURY GLASSMORPHISM
======================================= */
.register-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(30px);
    border-radius: 32px;
    padding: clamp(2.5rem, 8vw, 4rem);
    box-shadow: 
        0 45px 100px rgba(0,0,0,0.2),
        0 1px 0 rgba(255,255,255,0.9) inset;
    border: 1px solid rgba(255,255,255,0.8);
    animation: cardFloat 6s ease-in-out infinite;
}

@keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

.card-header {
    text-align: center;
    margin-bottom: clamp(2.5rem, 7vw, 3.5rem);
}

.header-icon {
    font-size: clamp(3.5rem, 10vw, 5rem);
    background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
    width: clamp(6rem, 14vw, 7.5rem);
    height: clamp(6rem, 14vw, 7.5rem);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto clamp(1.5rem, 4vw, 2rem) auto;
    box-shadow: 0 20px 50px rgba(102,126,234,0.25);
}

.register-title {
    color: #1e293b;
    font-size: clamp(2.25rem, 7vw, 3.25rem);
    font-weight: 900;
    margin: 0 0 clamp(0.875rem, 2.5vw, 1.25rem) 0;
    line-height: 1.2;
    letter-spacing: -0.025em;
}

.register-subtitle {
    color: #64748b;
    font-size: clamp(1.125rem, 3.5vw, 1.5rem);
    margin: 0;
    font-weight: 400;
    line-height: 1.6;
}

/* ========================================
   CRISPY FORM - PERFECT MOBILE
======================================= */
.register-form {
    width: 100%;
}

div.form-group {
    margin-bottom: clamp(2.25rem, 6vw, 3rem) !important;
}

label {
    color: #1e293b !important;
    font-weight: 800 !important;
    font-size: clamp(1.125rem, 3.2vw, 1.375rem) !important;
    margin-bottom: clamp(1rem, 3vw, 1.375rem) !important;
    display: block !important;
    letter-spacing: -0.015em;
}

/* ALL INPUT FIELDS */
input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"],
select {
    width: 100% !important;
    padding: clamp(1.25rem, 3.5vw, 1.75rem) clamp(1.75rem, 5vw, 2.5rem) !important;
    border: 3px solid #e2e8f0 !important;
    border-radius: 24px !important;
    font-size: clamp(1.125rem, 3.2vw, 1.375rem) !important;
    background: linear-gradient(145deg, #ffffff, #fafbfc) !important;
    box-shadow: 
        0 12px 35px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,1) !important;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    appearance: none;
}

input:focus,
select:focus {
    outline: none !important;
    border-color: #667eea !important;
    box-shadow: 
        0 0 0 6px rgba(102,126,234,0.2),
        0 25px 60px rgba(102,126,234,0.25) !important;
    transform: translateY(-4px) !important;
}

/* PASSWORD FIELD */
input[type="password"] {
    letter-spacing: 0.05em;
}

/* SELECT FIELD */
select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5' d='M6 9l6 6 6-6'/%3e%3c/svg%3e") !important;
    background-position: right 1.75rem center !important;
    background-repeat: no-repeat !important;
    background-size: 1.75em !important;
    padding-right: 5rem !important;
    cursor: pointer !important;
}

/* ========================================
   ERROR STYLING
======================================= */
.text-danger {
    color: #ef4444 !important;
    font-size: clamp(0.95rem, 2.8vw, 1.125rem) !important;
    margin-top: 1rem !important;
    font-weight: 700 !important;
    display: block !important;
}

.has-error input,
.has-error select {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 6px rgba(239,68,68,0.25) !important;
}

/* ========================================
   SUBMIT BUTTON - SPECTACULAR
======================================= */
.submit-button {
    width: 100%;
    padding: clamp(1.5rem, 4vw, 2rem) clamp(3rem, 8vw, 4rem);
    background:  linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white !important;
    border: none !important;
    border-radius: 28px !important;
    font-size: clamp(1.25rem, 3.5vw, 1.625rem) !important;
    font-weight: 900 !important;
    cursor: pointer !important;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
    min-height: clamp(70px, 18vh, 85px);
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: clamp(1.5rem, 4vw, 2rem);
}

.submit-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.7s;
}

.submit-button:hover {
    transform: translateY(-6px);
    box-shadow: 
        0 40px 90px rgba(16,185,129,0.55),
        0 15px 40px rgba(0,0,0,0.2) !important;
}

.submit-button:hover::before {
    left: 100%;
}

.submit-button:active {
    transform: translateY(-2px);
}

.btn-text {
    font-weight: 900;
    position: relative;
    z-index: 2;
}

.btn-icon {
    font-size: 1.4em;
    transition: transform 0.4s ease;
    position: relative;
    z-index: 2;
}

.submit-button:hover .btn-icon {
    transform: scale(1.2) rotate(20deg);
}

/* ========================================
   FOOTER
======================================= */
.card-footer {
    text-align: center;
    padding-top: clamp(1.75rem, 5vw, 2.5rem);
    margin-top: clamp(2rem, 5vw, 3rem);
    border-top: 1px solid #e2e8f0;
}

.card-footer p {
    color: #64748b;
    font-size: clamp(1rem, 3vw, 1.25rem);
    margin: 0;
}

.login-link {
    color: #667eea;
    text-decoration: none;
    font-weight: 800;
    transition: color 0.3s ease;
}

.login-link:hover {
    color: #5a67d8;
    text-decoration: underline;
}

/* ========================================
   MOBILE PERFECTION
======================================= */
@media (max-width: 480px) {
    .register-wrapper {
        padding: 2rem 1.25rem;
    }
    
    .register-card {
        padding: 2.5rem 2rem;
        border-radius: 28px;
    }
    
    input,
    select {
        padding: 1.5rem 1.75rem !important;
        font-size: 1.125rem !important;
    }
}

/* ========================================
   DARK MODE
======================================= */
@media (prefers-color-scheme: dark) {
    .register-card {
        background: rgba(30,41,59,0.98);
        border-color: rgba(51,65,85,0.8);
    }
    
    label {
        color: #f1f5f9 !important;
    }
    
    input,
    select {
        background: linear-gradient(145deg, #334155, #1e293b) !important;
        border-color: #475569 !important;
        color: #f1f5f9 !important;
    }
    
    .register-subtitle,
    .card-footer p {
        color: #94a3b8 !important;
    }
}

/* iOS SAFARI */
input,
select {
    font-size: 16px !important;
}
</style>

{% endblock %}
