{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="profile-editor-wrapper">
    <div class="responsive-container">
        <div class="profile-editor-card">
            <div class="editor-header">
                <div class="header-visual">
                    <div class="header-icon">👤</div>
                </div>
                <h1 class="editor-title">Edit Your Profile</h1>
                <p class="editor-subtitle">Update your personal or professional information</p>
            </div>
            
            <form method='POST' enctype="multipart/form-data" class="profile-editor-form">
                {% csrf_token %}
                {{ form|crispy }}
                
                <div class="editor-actions">
                    <button type="submit" class="primary-action">
                        <span>Update Profile</span>
                        <span class="action-icon">💾</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* ========================================
   RESPONSIVE FULL WRAPPER
======================================= */
.profile-editor-wrapper {
    min-height: 100vh;
    padding: clamp(1.5rem, 8vw, 4rem) clamp(1rem, 8vw, 3.5rem);
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 40%, #f1f5f9 100%);
    position: relative;
    overflow: hidden;
}

.profile-editor-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(102,126,234,0.4), transparent);
    z-index: 0;
}

.responsive-container {
    max-width: 950px;
    margin: 0 auto;
    width: 100%;
    position: relative;
    z-index: 2;
    padding: 0 clamp(0.5rem, 2vw, 2rem);
}

/* ========================================
   PROFILE EDITOR CARD
======================================= */
.profile-editor-card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(28px);
    border-radius: clamp(20px, 6vw, 36px);
    padding: clamp(2rem, 8vw, 5rem);
    box-shadow: 
        0 25px 75px rgba(0,0,0,0.15),
        0 1px 0 rgba(255,255,255,1) inset;
    border: 1px solid rgba(255,255,255,0.85);
    animation: editorSlide 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: clamp(1rem, 3vw, 2rem);
}

@keyframes editorSlide {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* HEADER */
.editor-header {
    text-align: center;
    margin-bottom: clamp(2.5rem, 7vw, 5rem);
}

.header-visual {
    display: flex;
    justify-content: center;
    margin-bottom: clamp(1.5rem, 5vw, 3rem);
}

.header-icon {
    font-size: clamp(3.5rem, 14vw, 6rem);
    background: linear-gradient(135deg, #667eea30, #764ba235);
    width: clamp(5.5rem, 18vw, 9rem);
    height: clamp(5.5rem, 18vw, 9rem);
    border-radius: clamp(16px, 4vw, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
        0 20px 50px rgba(102,126,234,0.25),
        inset 0 1px 0 rgba(255,255,255,0.6);
}

.editor-title {
    color: #1e293b;
    font-size: clamp(2rem, 7vw, 3.75rem);
    font-weight: 950;
    margin: 0 0 clamp(1rem, 3vw, 1.875rem) 0;
    line-height: 1.15;
    letter-spacing: -0.03em;
}

.editor-subtitle {
    color: #64748b;
    font-size: clamp(1.125rem, 3.5vw, 1.75rem);
    margin: 0;
    font-weight: 400;
    line-height: 1.6;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

/* ========================================
   CRISPY FORM PERFECTION
======================================= */
.profile-editor-form {
    width: 100%;
}

div.form-group {
    margin-bottom: clamp(2.5rem, 6vw, 4rem) !important;
}

label {
    color: #1e293b !important;
    font-weight: 900 !important;
    font-size: clamp(1.125rem, 3.5vw, 1.625rem) !important;
    margin-bottom: clamp(1rem, 3vw, 2rem) !important;
    display: block !important;
    letter-spacing: -0.02em;
}

/* ALL FORM INPUTS */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="url"],
input[type="number"],
input[type="date"],
textarea,
select,
input[type="file"] {
    width: 100% !important;
    padding: clamp(1rem, 3vw, 1.5rem) !important;
    font-size: clamp(1rem, 2.5vw, 1.125rem) !important;
    border: 2px solid #e2e8f0 !important;
    border-radius: clamp(12px, 3vw, 20px) !important;
    background: rgba(255, 255, 255, 0.9) !important;
    backdrop-filter: blur(12px) !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    box-sizing: border-box !important;
    min-height: clamp(3rem, 6vw, 4rem) !important;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="tel"]:focus,
input[type="url"]:focus,
input[type="number"]:focus,
input[type="date"]:focus,
textarea:focus,
select:focus,
input[type="file"]:focus {
    outline: none !important;
    border-color: #667eea !important;
    box-shadow: 
        0 0 0 4px rgba(102, 126, 234, 0.1),
        0 8px 25px rgba(102, 126, 234, 0.15) !important;
    transform: translateY(-2px) !important;
}

textarea {
    resize: vertical !important;
    min-height: 120px !important;
}

input[type="file"] {
    padding: clamp(0.75rem, 2vw, 1rem) !important;
    background: rgba(248, 250, 252, 0.8) !important;
}

input[type="file"]::-webkit-file-upload-button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 1rem;
    transition: all 0.3s ease;
}

input[type="file"]::-webkit-file-upload-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

/* ========================================
   BUTTON STYLING
======================================= */
.editor-actions {
    margin-top: clamp(2rem, 5vw, 3rem);
    display: flex;
    justify-content: center;
}

.primary-action {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: clamp(1.25rem, 4vw, 1.75rem) clamp(2.5rem, 6vw, 3.5rem);
    font-size: clamp(1.125rem, 3vw, 1.25rem);
    font-weight: 800;
    border-radius: clamp(16px, 4vw, 24px);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 
        0 20px 50px rgba(102, 126, 234, 0.4),
        0 4px 15px rgba(102, 126, 234, 0.3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.02em;
    position: relative;
    overflow: hidden;
    min-height: 56px;
}

.primary-action:hover {
    transform: translateY(-4px);
    box-shadow: 
        0 30px 75px rgba(102, 126, 234, 0.5),
        0 8px 25px rgba(102, 126, 234, 0.4);
}

.primary-action:active {
    transform: translateY(-2px);
}

.action-icon {
    font-size: 1.25em;
    transition: transform 0.3s ease;
}

.primary-action:hover .action-icon {
    transform: scale(1.1);
}

/* ========================================
   MOBILE-SPECIFIC OPTIMIZATIONS
======================================= */
@media (max-width: 480px) {
    .profile-editor-wrapper {
        padding: 1.25rem 1rem;
        min-height: 100vh;
    }
    
    .profile-editor-card {
        padding: 2rem 1.5rem;
        border-radius: 24px;
        margin: 0;
    }
    
    .header-icon {
        width: 80px !important;
        height: 80px !important;
        font-size: 2.5rem !important;
    }
    
    .editor-title {
        font-size: 2rem !important;
        line-height: 1.2;
    }
    
    div.form-group {
        margin-bottom: 2rem !important;
    }
    
    label {
        font-size: 1.125rem !important;
        margin-bottom: 1rem !important;
    }
    
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    input[type="date"],
    textarea,
    select,
    input[type="file"] {
        padding: 1rem !important;
        font-size: 1rem !important;
        min-height: 50px !important;
    }
    
    .primary-action {
        padding: 1.25rem 2rem !important;
        font-size: 1.125rem !important;
        min-height: 52px !important;
        width: 100%;
        justify-content: center;
    }
}

/* Landscape mobile */
@media (max-height: 500px) and (orientation: landscape) {
    .profile-editor-wrapper {
        padding: 1rem;
    }
    
    .profile-editor-card {
        padding: 1.5rem;
    }
    
    .editor-header {
        margin-bottom: 1.5rem;
    }
    
    div.form-group {
        margin-bottom: 1.5rem !important;
    }
    
    .editor-actions {
        margin-top: 1.5rem;
    }
}

/* High DPI displays */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .profile-editor-card {
        backdrop-filter: blur(40px);
    }
    
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    input[type="date"],
    textarea,
    select {
        backdrop-filter: blur(20px);
    }
}

/* Reduce motion for accessibility */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

{% endblock %}
