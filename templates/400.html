{% extends "base.html" %}
{% block content %}
    <div style="
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
    ">
        <div style="
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        ">
            <div style="
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
                border-radius: 20px;
                padding: 4rem 3rem;
                text-align: center;
                width: 100%;
                max-width: 600px;
                position: relative;
                overflow: hidden;
            ">
                <!-- Top gradient bar (teal/blue accent for bad request) -->
                <div style="
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    height: 4px;
                    background: linear-gradient(90deg, #3498db, #2980b9);
                "></div>
                
                <!-- 400 Number with warning icon -->
                <div style="
                    font-size: 8rem;
                    font-weight: 700;
                    background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                    margin-bottom: 1rem;
                    line-height: 1;
                    position: relative;
                ">
                    400 ⚠️
                </div>
                
                <!-- Title -->
                <h1 style="
                    font-size: 2.5rem;
                    font-weight: 700;
                    color: #333;
                    margin-bottom: 1rem;
                    margin: 0;
                ">Bad Request</h1>
                
                <!-- Message -->
                <p style="
                    font-size: 1.2rem;
                    color: #666;
                    margin-bottom: 2.5rem;
                    line-height: 1.6;
                    margin: 0 0 2.5rem 0;
                ">
                    Your request couldn't be understood by the server. 
                    Please check your input and try again.
                </p>
                
                <!-- CTA Button -->
                <a href="javascript:location.reload()" style="
                    display: inline-block;
                    padding: 1rem 2rem;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    text-decoration: none;
                    border-radius: 25px;
                    font-weight: 500;
                    font-size: 1.1rem;
                    transition: all 0.3s ease;
                    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
                    margin-bottom: 1rem;
                " 
                onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 25px rgba(102, 126, 234, 0.6)'"
                onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 15px rgba(102, 126, 234, 0.4)'"
                >🔄 Refresh Page</a>
                
                <!-- Secondary links -->
                <div style="margin-top: 1rem;">
                    <a href="javascript:history.back()" style="
                        color: #3498db;
                        text-decoration: none;
                        font-weight: 500;
                        transition: color 0.3s;
                        margin-right: 2rem;
                    "
                    onmouseover="this.style.color='#2980b9'"
                    onmouseout="this.style.color='#3498db'"
                    >⬅️ Go Back</a>
                    
                    <a href="{% url 'home' %}" style="
                        color: #667eea;
                        text-decoration: none;
                        font-weight: 500;
                        transition: color 0.3s;
                    "
                    onmouseover="this.style.color='#764ba2'"
                    onmouseout="this.style.color='#667eea'"
                    >🏠 Go Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Responsive adjustments -->
    <style>
        @media (max-width: 768px) {
            body { padding: 1rem; }
        }
        @media (max-width: 768px) {
            div[style*='padding: 4rem 3rem'] {
                padding: 3rem 2rem !important;
                margin: 1rem !important;
            }
            div[style*='font-size: 8rem'] {
                font-size: 6rem !important;
            }
            h1[style*='font-size: 2.5rem'] {
                font-size: 2rem !important;
            }
        }
        @media (max-width: 480px) {
            div[style*='font-size: 6rem'] {
                font-size: 4.5rem !important;
            }
            h1[style*='font-size: 2rem'] {
                font-size: 1.8rem !important;
            }
            div[style*='margin-right: 2rem'] a {
                display: block !important;
                margin: 0.5rem 0 !important;
            }
        }
    </style>
{% endblock %}
