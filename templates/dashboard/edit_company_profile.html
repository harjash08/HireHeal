{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
{% include 'dashboard/sidebar.html' %}
<div class="profile-wrapper">
    <div class="responsive-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="header-content">
                    <div class="header-icon">🏢</div>
                    <h1 class="profile-title">Edit Company Profile</h1>
                </div>
                <p class="profile-subtitle">Update your company information to attract top talent</p>
            </div>
            
            <form method='POST' enctype="multipart/form-data" class="profile-form">
                {% csrf_token %}
                {{ form|crispy }}
                
                <div class="form-footer">
                    <button type="submit" class="submit-btn">
                        <span>Update Profile</span>
                        
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* ========================================
   MAIN RESPONSIVE WRAPPER
======================================= */
.profile-wrapper {
    min-height: 100vh;
    padding: clamp(2.5rem, 7vw, 4rem) clamp(1.5rem, 5vw, 3rem);
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
    position: relative;
}

.profile-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 20% 30%, rgba(102,126,234,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(16,185,129,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
}

.responsive-container {
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    position: relative;
    z-index: 2;
}

/* ========================================
   PROFILE CARD - LUXURY DESIGN
======================================= */
.profile-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(25px);
    border-radius: 32px;
    box-shadow: 
        0 35px 80px rgba(0,0,0,0.15),
        0 1px 0 rgba(255,255,255,0.9) inset;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.8);
    animation: cardSlideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes cardSlideUp {
    from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ========================================
   HEADER SECTION
======================================= */
.profile-header {
    padding: clamp(3rem, 8vw, 4rem) clamp(3rem, 8vw, 4rem) clamp(2.5rem, 6vw, 3rem);
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    border-bottom: 1px solid rgba(226,232,240,0.8);
    text-align: center;
    position: relative;
}

.profile-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 2px;
}

.header-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3vw, 1.5rem);
    margin-bottom: 1.5rem;
}

.header-icon {
    font-size: clamp(3rem, 9vw, 4.5rem);
    background: linear-gradient(135deg, #667eea20, #764ba220);
    width: clamp(5rem, 12vw, 6.5rem);
    height: clamp(5rem, 12vw, 6.5rem);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(102,126,234,0.2);
}

.profile-title {
    color: #5a6fd8;
    font-size: clamp(2.125rem, 6vw, 3rem);
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    letter-spacing: -0.025em;
}

.profile-subtitle {
    color: #64748b;
    font-size: clamp(1.125rem, 3.2vw, 1.375rem);
    margin: 0;
    font-weight: 400;
    max-width: 550px;
    line-height: 1.6;
}

/* ========================================
   CRISPY FORM - PERFECT RESPONSIVE
======================================= */
.profile-form {
    padding: clamp(3rem, 8vw, 4.5rem);
}

/* FORM GROUPS */
div.form-group {
    margin-bottom: clamp(2.25rem, 5.5vw, 3rem) !important;
}

label {
    color: #1e293b !important;
    font-weight: 800 !important;
    font-size: clamp(1.05rem, 3vw, 1.25rem) !important;
    margin-bottom: clamp(0.875rem, 2.5vw, 1.125rem) !important;
    display: block !important;
    letter-spacing: -0.015em;
}

/* INPUT FIELDS */
input[type="text"],
input[type="email"],
input[type="url"],
input[type="number"],
textarea,
select {
    width: 100% !important;
    padding: clamp(1.125rem, 3.2vw, 1.5rem) clamp(1.5rem, 4.5vw, 2rem) !important;
    border: 2px solid #e2e8f0 !important;
    border-radius: 20px !important;
    font-size: clamp(1.05rem, 3vw, 1.25rem) !important;
    background: linear-gradient(145deg, #ffffff, #fafbfc) !important;
    box-shadow: 
        0 8px 25px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,1) !important;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    appearance: none;
}

input:focus,
select:focus,
textarea:focus {
    outline: none !important;
    border-color: #667eea !important;
    box-shadow: 
        0 0 0 5px rgba(102,126,234,0.15),
        0 20px 45px rgba(102,126,234,0.25) !important;
    transform: translateY(-3px) !important;
}

textarea {
    resize: vertical !important;
    min-height: clamp(160px, 22vh, 200px) !important;
    line-height: 1.65 !important;
}

/* FILE INPUT */
input[type="file"] {
    padding: clamp(0.875rem, 2.5vw, 1.125rem) !important;
    background: #f8fafc !important;
}

/* SELECT STYLING */
select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 9l6 6 6-6'/%3e%3c/svg%3e") !important;
    background-position: right 1.25rem center !important;
    background-repeat: no-repeat !important;
    background-size: 1.5em !important;
    padding-right: 4rem !important;
    cursor: pointer !important;
}

/* ========================================
   ERROR HANDLING
======================================= */
.text-danger {
    color: #ef4444 !important;
    font-size: clamp(0.9rem, 2.5vw, 1rem) !important;
    margin-top: 0.875rem !important;
    font-weight: 600 !important;
    display: block !important;
}

.has-error input,
.has-error select,
.has-error textarea {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 5px rgba(239,68,68,0.2) !important;
}

/* ========================================
   SUBMIT BUTTON - LUXURY
======================================= */
.form-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    margin-top: clamp(3rem, 7vw, 4rem);
    padding-top: clamp(2.5rem, 6vw, 3rem);
    border-top: 2px solid #e2e8f0;
}

.submit-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    width: 100%;
    max-width: 350px;
    padding: clamp(1.25rem, 3.5vw, 1.625rem) clamp(3rem, 8vw, 4rem);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    color: white !important;
    border: none !important;
    border-radius: 24px !important;
    font-size: clamp(1.125rem, 3.2vw, 1.375rem) !important;
    font-weight: 900 !important;
    cursor: pointer !important;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    min-height: 68px;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.6s;
}

.submit-btn:hover {
    transform: translateY(-4px);
    box-shadow: 
        0 30px 60px rgba(16,185,129,0.5),
        0 8px 25px rgba(0,0,0,0.15) !important;
}

.submit-btn:hover::before {
    left: 100%;
}

.submit-btn:active {
    transform: translateY(-1px);
}

.btn-icon {
    font-size: 1.3em;
    transition: transform 0.3s ease;
}

.submit-btn:hover .btn-icon {
    transform: scale(1.15);
}

/* ========================================
   MOBILE PERFECTION
======================================= */
@media (max-width: 768px) {
    .profile-wrapper {
        padding: clamp(2.5rem, 10vw, 4rem) 1.5rem;
    }
    
    .profile-form {
        padding: 2.5rem 2rem;
    }
    
    .profile-header {
        padding: 3rem 2.5rem 2.5rem;
    }
}

@media (max-width: 480px) {
    .responsive-container {
        margin: 0 -1rem;
    }
    
    .profile-card {
        border-radius: 28px;
        margin: 0 -1rem;
    }
    
    .profile-form {
        padding: 2rem 1.5rem;
    }
    
    .header-icon {
        width: 5.5rem;
        height: 5.5rem;
        font-size: 2.5rem;
    }
}

/* ========================================
   CRISPY HELP TEXT
======================================= */
.help-block {
    font-size: clamp(0.9rem, 2.5vw, 1.05rem) !important;
    color: #6b7280 !important;
    margin-top: 1rem !important;
    line-height: 1.55 !important;
    font-weight: 500 !important;
}

/* iOS SAFARI FIX */
input,
select {
    font-size: 16px !important;
}

/* DARK MODE SUPPORT */
@media (prefers-color-scheme: dark) {
    .profile-card {
        background: rgba(30,41,59,0.98);
        border-color: rgba(51,65,85,0.8);
    }
    
    label {
        color: #f1f5f9 !important;
    }
    
    input,
    select,
    textarea {
        background: linear-gradient(145deg, #334155, #1e293b) !important;
        border-color: #475569 !important;
        color: #f1f5f9 !important;
    }
    
    .profile-subtitle,
    .help-block {
        color: #94a3b8 !important;
    }
    
    .profile-header {
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    }
}
</style>

{% endblock %}
