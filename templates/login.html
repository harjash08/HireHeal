{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>
            
            <form method='POST' action="{% url 'login_view' %}" class="login-form">
                {% csrf_token %}
                {{ form|crispy }}
                
                <button type="submit" class="submit-button">
                    <span class="btn-text">Sign In</span>
                   
                </button>
            </form>
            
            <div class="card-footer">
                <p>Don't have an account? <a href="{% url 'register' %}" class="register-link">Create one</a></p>
            </div>
        </div>
    </div>
</div>

<style>
/* ========================================
   FULLSCREEN ELEGANT WRAPPER
======================================= */
.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 5vw, 3rem);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 55%, #f5576c 85%);
    position: relative;
    overflow: hidden;
}

.login-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
         linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    pointer-events: none;
    z-index: 0;
}

.login-container {
    width: 100%;
    max-width: clamp(380px, 85vw, 480px);
    position: relative;
    z-index: 2;
}

/* ========================================
   LOGIN CARD - GLASSMORPHISM PERFECTION
======================================= */
.login-card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(35px);
    border-radius: 32px;
    padding: clamp(2.75rem, 9vw, 4.5rem);
    box-shadow: 
        0 55px 120px rgba(0,0,0,0.25),
        0 1px 0 rgba(255,255,255,1) inset;
    border: 1px solid rgba(255,255,255,0.85);
    animation: cardGlow 4s ease-in-out infinite alternate;
}

@keyframes cardGlow {
    0% { 
        box-shadow: 
            0 55px 120px rgba(0,0,0,0.25),
            0 1px 0 rgba(255,255,255,1) inset;
    }
    100% { 
        box-shadow: 
            0 65px 140px rgba(102,126,234,0.15),
            0 1px 0 rgba(255,255,255,1) inset;
    }
}

.card-header {
    text-align: center;
    margin-bottom: clamp(3rem, 8vw, 4rem);
}

.header-icon {
    font-size: clamp(4rem, 12vw, 5.5rem);
    background: linear-gradient(135deg, rgba(102,126,234,0.25), rgba(118,75,162,0.25));
    width: clamp(6.5rem, 15vw, 8rem);
    height: clamp(6.5rem, 15vw, 8rem);
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto clamp(1.75rem, 5vw, 2.5rem) auto;
    box-shadow: 0 25px 65px rgba(102,126,234,0.3);
}

.login-title {
    color: #1e293b;
    font-size: clamp(2.5rem, 8vw, 3.75rem);
    font-weight: 950;
    margin: 0 0 clamp(1rem, 3vw, 1.5rem) 0;
    line-height: 1.15;
    letter-spacing: -0.03em;
}

.login-subtitle {
    color: #64748b;
    font-size: clamp(1.25rem, 4vw, 1.625rem);
    margin: 0;
    font-weight: 400;
    line-height: 1.55;
}

/* ========================================
   CRISPY FORM - FLAWLESS MOBILE
======================================= */
.login-form {
    width: 100%;
}

div.form-group {
    margin-bottom: clamp(2.75rem, 7vw, 3.75rem) !important;
}

label {
    color: #1e293b !important;
    font-weight: 900 !important;
    font-size: clamp(1.25rem, 3.8vw, 1.5rem) !important;
    margin-bottom: clamp(1.25rem, 3.5vw, 1.75rem) !important;
    display: block !important;
    letter-spacing: -0.02em;
}

/* INPUT FIELDS - PREMIUM */
input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100% !important;
    padding: clamp(1.5rem, 4.2vw, 2.125rem) clamp(2.25rem, 6.5vw, 3.25rem) !important;
    border: 3px solid #e2e8f0 !important;
    border-radius: 28px !important;
    font-size: clamp(1.25rem, 3.8vw, 1.625rem) !important;
    background: linear-gradient(145deg, #ffffff, #fafbff) !important;
    box-shadow: 
        0 18px 45px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,1),
        inset 0 -1px 0 rgba(226,232,240,0.8) !important;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
    appearance: none;
}

input[type="password"] {
    letter-spacing: 0.075em;
    font-feature-settings: "liga" 0;
}

input:focus {
    outline: none !important;
    border-color: #667eea !important;
    box-shadow: 
        0 0 0 8px rgba(102,126,234,0.25),
        0 35px 85px rgba(102,126,234,0.3) !important;
    transform: translateY(-6px) !important;
}

/* ========================================
   ERROR STATES
======================================= */
.text-danger {
    color: #ef4444 !important;
    font-size: clamp(1.125rem, 3.5vw, 1.375rem) !important;
    margin-top: 1.25rem !important;
    font-weight: 800 !important;
    display: block !important;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.has-error input {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 8px rgba(239,68,68,0.3) !important;
    animation: shake 0.5s ease-in-out;
}

/* ========================================
   SIGN IN BUTTON - ABSOLUTE FIRE
======================================= */
.submit-button {
    width: 100%;
    padding: clamp(1.75rem, 5vw, 2.5rem) clamp(3.5rem, 10vw, 5rem);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #5a67d8 100%) !important;
    color: white !important;
    border: none !important;
    border-radius: 32px !important;
    font-size: clamp(1.375rem, 4.2vw, 1.875rem) !important;
    font-weight: 950 !important;
    cursor: pointer !important;
    box-shadow: 
        0 35px 85px rgba(102,126,234,0.5),
        0 1px 0 rgba(255,255,255,0.5) inset !important;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) !important;
    min-height: clamp(85px, 22vh, 105px);
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: clamp(2.5rem, 6vw, 3.75rem);
}

.submit-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 120%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(255,255,255,0.4), 
        rgba(255,255,255,0.6), 
        rgba(255,255,255,0.4), 
        transparent
    );
    transition: left 0.8s;
}

.submit-button:hover {
    transform: translateY(-10px);
    box-shadow: 
        0 55px 120px rgba(102,126,234,0.65),
        0 25px 60px rgba(0,0,0,0.25) !important;
}

.submit-button:hover::before {
    left: 120%;
}

.submit-button:active {
    transform: translateY(-3px);
}

.btn-text {
    font-weight: 950;
    position: relative;
    z-index: 2;
    letter-spacing: 1px;
}

.btn-icon {
    font-size: 1.5em;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    position: relative;
    z-index: 2;
}

.submit-button:hover .btn-icon {
    transform: scale(1.3) translateX(8px);
}

/* ========================================
   FOOTER LINK
======================================= */
.card-footer {
    text-align: center;
    padding-top: clamp(2.25rem, 6vw, 3.25rem);
    margin-top: clamp(2.75rem, 7vw, 4rem);
    border-top: 2px solid #e2e8f0;
}

.card-footer p {
    color: #64748b;
    font-size: clamp(1.125rem, 3.5vw, 1.5rem);
    margin: 0;
    line-height: 1.6;
}

.register-link {
    color: #667eea;
    text-decoration: none;
    font-weight: 900;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.register-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: width 0.4s ease;
}

.register-link:hover {
    color: #5a67d8;
}

.register-link:hover::after {
    width: 100%;
}

/* ========================================
   MOBILE MASTERPIECE
======================================= */
@media (max-width: 480px) {
    .login-wrapper {
        padding: 2.5rem 1.5rem;
    }
    
    .login-card {
        padding: 3rem 2.25rem;
        border-radius: 28px;
    }
    
    input {
        padding: 1.75rem 2.25rem !important;
        font-size: 1.375rem !important;
    }
    
    .header-icon {
        width: 7rem;
        height: 7rem;
        font-size: 3.25rem;
    }
}

/* ========================================
   DARK MODE PERFECTION
======================================= */
@media (prefers-color-scheme: dark) {
    .login-card {
        background: rgba(30,41,59,0.98);
        border-color: rgba(51,65,85,0.9);
    }
    
    label {
        color: #f1f5f9 !important;
    }
    
    input {
        background: linear-gradient(145deg, #334155, #1e293b) !important;
        border-color: #475569 !important;
        color: #f1f5f9 !important;
    }
    
    .login-subtitle,
    .card-footer p {
        color: #94a3b8 !important;
    }
    
    .card-footer {
        border-color: #475569;
    }
}

/* iOS PRECISION */
input {
    font-size: 16px !important;
}
</style>

{% endblock %}
