{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container-fluid px-3 px-md-4 py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <h3 class="card-title text-center mb-4 fw-bold text-primary">
            Schedule Interview
          </h3>
          
          <form method="POST" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <div class="mb-4">
              <label class="form-label fw-semibold mb-3 text-dark">
                Message to Candidate:
              </label>
              {{ form | crispy }}
            </div>

            <div class="d-grid d-md-flex gap-2 justify-content-center">
              <button type="submit" class="btn gradient-btn btn-lg w-100 w-md-auto px-4 py-2 fw-semibold shadow-sm">
                <i class="fas fa-paper-plane me-2"></i>
                Send Interview Email
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* Custom responsive styles */
@media (max-width: 576px) {
  .container-fluid {
    padding-left: 1rem !important;
    padding-right: 1rem !important;
  }
  
  .card-body {
    padding: 1.5rem !important;
  }
  
  h3.card-title {
    font-size: 1.5rem;
  }
}

@media (min-width: 768px) {
  .btn-lg {
    min-width: 180px;
  }
}

/* Form field enhancements */
.form-label {
  font-size: 1rem;
}

.form-control, .form-control:focus {
  border-radius: 0.5rem;
  border: 2px solid #e9ecef;
  padding: 0.75rem 1rem;
  font-size: 1rem;
}

.form-control:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}

/* Gradient Button Styles */
.gradient-btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
  border: none !important;
  color: white !important;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}

.gradient-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}

.gradient-btn:hover::before {
  left: 100%;
}

.gradient-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0.5rem 1.5rem rgba(102, 126, 234, 0.4) !important;
  background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%) !important;
}

.gradient-btn:active {
  transform: translateY(-1px);
}
</style>
{% endblock %}
